- name: zen.mods.updated-value-observer
  value: false

- name: zen.mods.auto-update-days
  value: 20 # In days

# [adrenaline_brow] Disabled: background auto-update fetched mod manifests from
# zen-browser.github.io on a timer. Users can still install/update mods manually
# from the marketplace. Set to true to restore Zen's background auto-update.
- name: zen.mods.auto-update
  value: false

# === Mark: Site Injection ===

- name: zen.injections.match-urls
  value: "https://zen-browser.app/*"
  locked: true
  condition: "defined(MOZILLA_OFFICIAL)"

- name: zen.injections.match-urls
  value: "http://localhost/*"
  condition: "!defined(MOZILLA_OFFICIAL)"
