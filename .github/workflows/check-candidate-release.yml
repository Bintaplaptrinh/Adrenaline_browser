name: Check Firefox Candidate Release

on:
  # Scheduled runs are disabled on this fork: the upstream schedule requires
  # infrastructure/secrets that are not configured here. Trigger manually
  # from the Actions tab if you need a run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Check for any updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_IDS: ${{ secrets.DISCORD_PING_IDS }}
        run: |
          python3 scripts/check_rc_response.py

  sync-upstream:
    name: Sync Upstream
    uses: ./.github/workflows/sync-upstream.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    needs: [check_candidates]
    with:
      release_candidate: true
