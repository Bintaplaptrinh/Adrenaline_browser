name: Debian Auto Build and Release

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping release builds on the self-hosted runner.
concurrency:
  group: deb-release-master
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Bintaplaptrinh/Adrenaline_browser' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_id: ${{ steps.metadata.outputs.build_id }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Test Debian release and updater
        run: |
          node --experimental-vm-modules tests/deb-updates.test.mjs
          python3 -m unittest discover -s tests -p 'test_deb_release.py'
      - name: Generate release identity
        id: metadata
        run: python3 scripts/deb-release.py prepare

  build:
    needs: prepare
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      SURFER_PLATFORM: linux
      SURFER_COMPAT: ${{ matrix.arch }}
      ADRENALINE_RELEASE: "1"
      ADRENALINE_RELEASE_BRANCH: release
      ADRENALINE_GA_DISABLE_PGO: "true"
      ADRENALINE_DISABLE_LTO: "true"
      MOZ_BUILD_DATE: ${{ needs.prepare.outputs.build_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Check runner capacity
        run: |
          test "$(uname -m)" = x86_64
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 62914560 || {
            echo "::error::The build runner needs at least 60 GiB free per build."
            exit 1
          }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld mercurial curl \
            dos2unix yasm nasm m4 uuid-dev libasound2-dev libcurl4-openssl-dev \
            libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev python3-dev python3-venv xvfb xz-utils \
            zstd zip unzip dpkg-dev
      - name: Install project dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Configure release brand and download Firefox
        run: |
          npm run surfer -- ci --brand release
          npm run download
      - name: Install pinned Rust toolchain
        run: |
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/adrenaline-rustup.sh"
            sh "$RUNNER_TEMP/adrenaline-rustup.sh" -y --no-modify-path --default-toolchain none
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install "$(cat .rust-toolchain)" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$(cat .rust-toolchain)" >> "$GITHUB_ENV"
          if [ "$SURFER_COMPAT" = aarch64 ]; then
            rustup target add --toolchain "$(cat .rust-toolchain)" aarch64-unknown-linux-gnu
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Import browser sources
        run: npm run import
      - name: Bootstrap Firefox toolchains
        working-directory: engine
        run: ./mach --no-interactive bootstrap --application-choice browser
      - name: Build browser
        run: npm run build
      - name: Package Debian application
        run: |
          # Use mach directly: the Surfer package command also creates MAR files.
          cd engine
          ./mach package
          cd ..
          python3 scripts/deb-release.py package \
            --arch "$SURFER_COMPAT" \
            --version "$DEB_VERSION" \
            --build-id "$MOZ_BUILD_DATE"
        env:
          DEB_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Validate packages and generate update metadata
        run: |
          python3 scripts/deb-release.py manifest \
            --version "$DEB_VERSION" --build-id "$DEB_BUILD_ID" --tag "$DEB_TAG"
        env:
          DEB_VERSION: ${{ needs.prepare.outputs.version }}
          DEB_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          DEB_TAG: ${{ needs.prepare.outputs.tag }}
      - name: Check whether a newer source build is queued
        id: current
        run: |
          git fetch origin master --no-tags
          if git diff --quiet "$GITHUB_SHA" origin/master -- . ':(exclude)docs/**' ':(exclude)**/*.md'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer source revision is on master; keeping this build as an artifact and waiting for its replacement." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish Debian release
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Adrenaline ${{ needs.prepare.outputs.version }} (Debian)
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/adrenaline-update.json
            dist/SHA256SUMS
