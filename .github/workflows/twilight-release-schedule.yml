name: Adrenaline Twilight Scheduled Releases

on:
  # Scheduled runs are disabled on this fork: the upstream schedule requires
  # infrastructure/secrets that are not configured here. Trigger manually
  # from the Actions tab if you need a run.
  workflow_dispatch:
    inputs:
      create_release:
        description: "Whether to do a release"
        required: false
        type: boolean
        default: true

jobs:
  twilight-release-schedule:
    name: Twilight Release Schedule
    permissions: write-all
    secrets: inherit
    uses: ./.github/workflows/build.yml
    with:
      create_release: ${{ github.event_name != 'workflow_dispatch' && true || inputs.create_release }}
      update_branch: twilight
      use-sccache: true
      update_version: false

  post-build:
    name: Post Build
    runs-on: ubuntu-latest
    needs: twilight-release-schedule
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
