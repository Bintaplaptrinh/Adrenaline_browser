<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New Tab</title>
  <link rel="stylesheet" href="chrome://browser/content/adrenaline-newtab/AdrenalineNewTab.css" />
</head>
<body>
  <!-- Particle system: hundreds of particles, constellation + wave. -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <header id="topbar">
    <div id="brand">
      <svg viewBox="0 0 1024 1024" width="24" height="24" aria-hidden="true">
        <path d="M 424.8 290.2 A 98 98 0 0 1 599.2 290.2 L 789.2 660.2 A 98 98 0 0 1 735.6 797.1 Q 512.0 632.1 288.4 797.1 A 98 98 0 0 1 234.8 660.2 Z" fill="currentColor"/>
      </svg>
      <span>Adrenaline</span>
    </div>
    <button id="theme-toggle" title="Toggle dark / light">&#9689;</button>
  </header>

  <main id="stage">
    <h1 id="hero-title"><span id="type-text"></span><span id="type-caret"></span></h1>

    <div id="search-wrap">
      <form id="search-form" autocomplete="off">
        <div id="search-pill">
          <svg id="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/>
          </svg>
          <input id="search-input" type="text" spellcheck="false" role="combobox"
                 aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"
                 placeholder="Search the web" autofocus />
          <button id="search-go" type="submit" title="Search" aria-label="Search">&#8594;</button>
        </div>
      </form>
      <ul id="suggest" role="listbox" hidden></ul>
    </div>

    <div id="suggestions" class="glass" aria-label="Search suggestions"></div>
  </main>

  <script src="chrome://browser/content/adrenaline-newtab/AdrenalineNewTab.js"></script>
</body>
</html>
